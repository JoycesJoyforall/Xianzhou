<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="云平时">
<meta name="theme-color" content="#FDF8F0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>咸粥楸芊·云平时</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ft:'ZCOOL XiaoWei','Noto Serif SC','PingFang SC',serif;
  --fb:'Noto Serif SC','PingFang SC','SimSun',serif;
  --bg:#FDF8F0;--text:#3A3632;--muted:#918A7E;--light:#C4BFB5;--faint:#E5E0D8;--border:#EBE7DF;--card:#FFFFFF;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:-webkit-fill-available;}
body{font-family:var(--fb);color:var(--text);background:var(--bg);min-height:100vh;min-height:-webkit-fill-available;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-bottom:calc(64px + var(--safe-b));}
button{font-family:var(--fb);cursor:pointer;border:none;background:none;-webkit-appearance:none;}
textarea,input{font-family:var(--fb);-webkit-appearance:none;}
input[type=date]{font-size:14px;padding:10px 12px;border:1px solid var(--faint);border-radius:10px;background:#fff;color:var(--text);width:100%;}
input[type=text]{width:100%;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);outline:none;background:#fff;}
.app{max-width:520px;margin:0 auto;padding:0 18px 20px;}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(253,248,240,0.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding:6px 0 calc(6px + var(--safe-b));z-index:100;}
.tabs button{flex:1;max-width:80px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  font-size:9.5px;color:var(--light);letter-spacing:0.5px;transition:color 0.2s;}
.tabs button.active{color:var(--text);}
.tabs button .ico{font-size:18px;line-height:1;}
.tabs button:active{transform:scale(0.92);}
.hdr{text-align:center;padding:calc(env(safe-area-inset-top,12px) + 24px) 0 16px;}
.hdr-title{font-size:26px;letter-spacing:8px;font-family:var(--ft);color:var(--text);}
.hdr-sub{font-size:11px;color:var(--light);letter-spacing:3px;margin-top:2px;}
.avatars{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 0 20px;}
.avatar{display:flex;flex-direction:column;align-items:center;gap:4px;}
.av-name{font-size:10px;color:var(--muted);letter-spacing:1px;}
.av-picker{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;}
.av-pick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:10px;border:2px solid transparent;transition:all 0.15s;}
.av-pick.sel{border-color:var(--text);background:rgba(0,0,0,0.03);}
.av-pick:active{transform:scale(0.9);}
.sec-cards{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;}
.sec-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border-radius:14px;
  box-shadow:0 1px 6px rgba(0,0,0,0.04);cursor:pointer;transition:transform 0.12s;border:1px solid var(--border);}
.sec-card:active{transform:scale(0.97);}
.sec-ico{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;flex-shrink:0;}
.sec-label{font-size:16px;font-family:var(--ft);letter-spacing:2px;}
.sec-desc{font-size:11px;color:var(--light);margin-top:1px;}
.sec-count{font-size:11px;color:var(--light);margin-left:auto;flex-shrink:0;}
.page-title{font-size:22px;font-family:var(--ft);letter-spacing:4px;text-align:center;padding:20px 0 4px;}
.page-desc{font-size:12px;color:var(--light);text-align:center;margin-bottom:8px;letter-spacing:2px;}
.values{text-align:center;padding:28px 0 12px;}
.values span{font-size:11px;color:var(--faint);letter-spacing:4px;font-family:var(--ft);font-style:italic;}
.date-filter{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 0 14px;}
.date-filter .arrow{font-size:18px;color:var(--light);padding:6px 10px;border-radius:8px;}
.date-filter .arrow:active{background:rgba(0,0,0,0.04);}
.date-filter .dt{font-size:13px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;position:relative;}
.date-filter .dt:active{background:rgba(0,0,0,0.03);}
.date-filter .dt input{position:absolute;opacity:0;width:1px;height:1px;top:0;left:50%;}
.date-filter .reset{font-size:11px;color:#D4896A;padding:4px 8px;}
.entries{display:flex;flex-direction:column;gap:10px;padding-bottom:80px;}
.entry{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.03);border:1px solid var(--border);}
.entry-date{font-size:11px;color:var(--light);}
.entry-text{font-size:14px;line-height:1.8;margin-top:4px;white-space:pre-wrap;}
.entry-who{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.entry-meta{display:flex;justify-content:space-between;align-items:center;}
.entry-del{font-size:11px;color:var(--faint);padding:4px 8px;}
.entry-del:active{color:#D4896A;}
.stars{display:inline-flex;gap:2px;}
.stars .star{font-size:16px;cursor:pointer;padding:2px;color:var(--faint);}
.stars .star.on{color:#CFA034;}
.stars-display{color:#CFA034;font-size:13px;letter-spacing:1px;}
.sticky{border-radius:4px 14px 14px 14px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,0.05);border:none;min-height:70px;}
.wish-done{opacity:0.55;}
.wish-done .entry-text{text-decoration:line-through;}
.wish-check{font-size:18px;padding:4px 8px;border-radius:8px;}
.wish-check:active{transform:scale(1.2);}
.photos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
.photo-add{width:72px;height:72px;border-radius:8px;border:2px dashed var(--faint);display:flex;align-items:center;
  justify-content:center;font-size:22px;color:var(--light);cursor:pointer;flex-shrink:0;}
.photo-add:active{background:rgba(0,0,0,0.03);}
.chengtrue{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.chengtrue-label{font-size:11px;color:var(--light);letter-spacing:2px;margin-bottom:6px;font-family:var(--ft);}
.fab{position:fixed;bottom:calc(76px + var(--safe-b));right:calc(50% - 240px);width:52px;height:52px;border-radius:26px;
  background:var(--text);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);z-index:90;transition:transform 0.15s;}
.fab:active{transform:scale(0.9);}
@media(max-width:520px){.fab{right:20px;}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:24px 20px calc(24px + var(--safe-b));
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-title{font-size:18px;font-family:var(--ft);letter-spacing:3px;text-align:center;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:6px;}
.field textarea{width:100%;min-height:60px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;
  font-size:14px;color:var(--text);resize:vertical;outline:none;background:#fff;line-height:1.7;}
.btn-row{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:14px;border-radius:12px;font-size:14px;letter-spacing:2px;font-family:var(--ft);text-align:center;}
.btn-primary{background:var(--text);color:#fff;}.btn-primary:active{opacity:0.8;}
.btn-cancel{background:var(--faint);color:var(--muted);}
.empty{text-align:center;padding:60px 20px;color:var(--light);font-size:13px;letter-spacing:2px;}
.rpt-nav{display:flex;justify-content:center;gap:14px;padding:0 0 14px;}
.rpt-nav button{font-size:13px;padding:4px 0;letter-spacing:2px;border-bottom:1.5px solid transparent;color:var(--light);}
.rpt-nav button.active{color:var(--text);border-bottom-color:var(--text);}
.rpt-pre{font-size:12px;line-height:1.9;color:#666;background:#F8F6F1;padding:18px;border-radius:12px;white-space:pre-wrap;
  word-break:break-word;border:1px solid #EBE7DF;max-height:400px;overflow-y:auto;font-family:var(--fb);}
.rpt-copy{display:block;width:100%;margin-top:14px;padding:14px 0;background:var(--text);color:#F5F3EE;border-radius:12px;
  font-size:14px;font-family:var(--ft);letter-spacing:4px;transition:background 0.3s;}
.rpt-copy.ok{background:#6B9E6B;}
.data-sec{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center;}
.data-sec .dt-title{font-size:13px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;font-family:var(--ft);}
.data-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.data-btn{padding:10px 18px;border-radius:10px;font-size:12px;letter-spacing:1px;background:#F0EDE8;color:var(--text);}
.data-btn:active{opacity:0.7;}
.data-btn.del{background:none;color:var(--light);font-size:11px;}
/* ══ HOME LAYOUT ══ */
.sec-label-row{font-size:12px;color:var(--muted);letter-spacing:3px;font-family:var(--ft);padding:22px 2px 10px;}
.weather{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:2px 0 6px;}
.w-av{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.w-ring{border-radius:50%;padding:3px;transition:transform .12s;}
.w-av:active .w-ring{transform:scale(.9);}
.w-name{font-size:10px;color:var(--muted);letter-spacing:1px;}
.w-zone{font-size:9px;color:var(--light);letter-spacing:1px;min-height:11px;}
/* ══ EMOTION / ZONES ══ */
.emo-hero{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.04);cursor:pointer;transition:transform .12s;}
.emo-hero:active{transform:scale(.98);}
.emo-hero-top{display:flex;align-items:center;gap:14px;}
.emo-hero-title{font-size:16px;font-family:var(--ft);letter-spacing:2px;}
.emo-hero-desc{font-size:11px;color:var(--light);margin-top:2px;}
.emo-monsters{display:flex;gap:8px;margin-top:14px;}
.monster-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:16px;background:var(--bg);transition:transform .12s;cursor:pointer;}
.monster-btn:active{transform:scale(.93);}
.monster-name{font-size:13px;font-family:var(--ft);letter-spacing:1px;}
.monster-sub{font-size:9px;color:var(--light);text-align:center;line-height:1.3;}
.emo-q{text-align:center;font-size:16px;font-family:var(--ft);letter-spacing:2px;color:var(--text);padding:14px 0 10px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 15px;border-radius:20px;border:1px solid var(--faint);background:#fff;font-size:13px;color:var(--muted);transition:all .12s;cursor:pointer;}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}
.chip:active{transform:scale(.93);}
.zone-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 11px;border-radius:14px;color:#fff;font-family:var(--ft);letter-spacing:1px;}
.emo-entry{background:var(--card);border-radius:14px;padding:13px 16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03);border-left-width:4px;}
.bigwave{animation:wob 2.6s ease-in-out infinite;transform-origin:center 80%;}
@keyframes wob{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.zone-grid{display:flex;gap:8px;}
.zone-pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;background:#fff;border:2px solid transparent;transition:all .12s;cursor:pointer;}
.zone-pick.sel{border-color:var(--text);}
.zone-pick:active{transform:scale(.93);}
.zone-pick span{font-size:11px;font-family:var(--ft);}
/* ══ PROFILE ══ */
.back-btn{font-size:13px;color:var(--muted);padding:16px 2px 4px;letter-spacing:1px;cursor:pointer;}
.back-btn:active{opacity:.6;}
.pf-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 16px;}
.pf-name{font-size:22px;font-family:var(--ft);letter-spacing:4px;}
.pf-sub{font-size:11px;color:var(--light);letter-spacing:2px;}
.pf-card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.04);margin-bottom:12px;}
.pf-card h4{font-size:13px;font-family:var(--ft);letter-spacing:2px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.pf-card h4 .hint{font-size:10px;color:var(--light);letter-spacing:1px;font-family:var(--fb);margin-left:auto;}
.pf-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.pf-row:last-child{margin-bottom:0;}
.pf-row label{font-size:12px;color:var(--muted);width:60px;flex-shrink:0;letter-spacing:1px;}
.pf-row input{flex:1;}
.pf-field{margin-bottom:12px;}
.pf-field:last-child{margin-bottom:0;}
.pf-field label{font-size:12px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:6px;}
.pf-field textarea{width:100%;min-height:50px;border:1px solid var(--faint);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);resize:vertical;outline:none;background:#fff;line-height:1.7;}
.pf-zodiac{font-size:13px;color:var(--muted);padding:2px 0 0;letter-spacing:1px;}
.tool-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.tool-row:last-child{margin-bottom:0;}
.tool-mon{flex-shrink:0;margin-top:3px;}
.tool-row textarea{flex:1;min-height:42px;border:1px solid var(--faint);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--text);resize:vertical;outline:none;background:#fff;line-height:1.6;}
.zbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 4px;background:var(--faint);}
.zlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
.zlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.pattern{font-size:12.5px;color:var(--muted);line-height:1.9;background:#F8F6F1;padding:11px 13px;border-radius:10px;margin-top:10px;}
.manual-btn{display:block;width:100%;margin-top:8px;padding:13px;border-radius:12px;background:#F0EDE8;color:var(--text);font-size:13px;font-family:var(--ft);letter-spacing:3px;cursor:pointer;}
.manual-btn:active{opacity:.75;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-t="home" onclick="go('home')"><span class="ico">🏠</span>首页</button>
  <button data-t="read" onclick="go('read')"><span class="ico">📖</span>共读</button>
  <button data-t="share" onclick="go('share')"><span class="ico">📝</span>在目</button>
  <button data-t="move" onclick="go('move')"><span class="ico">🚲</span>动动</button>
  <button data-t="make" onclick="go('make')"><span class="ico">🍞</span>劳作</button>
  <button data-t="wish" onclick="go('wish')"><span class="ico">🌊</span>愿望</button>
  <button data-t="emotion" onclick="go('emotion')"><span class="ico">👾</span>小怪兽</button>
</nav>
<input type="file" id="imp-f" accept=".json" style="display:none">

<script>
/* ══ FAMILY ══ */
const FM=[
  {id:'mama',name:'咸蛋妈妈',nick:'妈妈',c:'#E8927C',ch:'咸',badge:'🥚'},
  {id:'baba',name:'粥爸爸',nick:'爸爸',c:'#D4A84B',ch:'粥',badge:'🥣'},
  {id:'jj',name:'芊姐姐',nick:'早点',c:'#7BAE7F',ch:'芊',badge:'🌿'},
  {id:'mm',name:'楸妹妹',nick:'楸楸',c:'#E8B4B8',ch:'楸',badge:'🌸'},
  {id:'nn',name:'云奶奶',nick:'奶奶',c:'#89B4C8',ch:'云',badge:'☁️'},
  {id:'yy',name:'平爷爷',nick:'爷爷',c:'#A0846B',ch:'平',badge:'⛰️'},
];
const gFM=id=>FM.find(f=>f.id===id)||FM[0];

/* ── circle avatar ── */
function circleSvg(color,ch,size,badge){
  const fs=Math.round(size*0.32),r=size/2;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.08))">
    <circle cx="${r}" cy="${r}" r="${r}" fill="${color}"/>
    <text x="${r}" y="${r+fs*0.35}" text-anchor="middle" fill="#fff" font-size="${fs}" font-family="'ZCOOL XiaoWei','Noto Serif SC',serif">${ch}</text>`;
  if(badge)s+=`<text x="${size*0.78}" y="${size*0.92}" text-anchor="middle" font-size="${Math.round(size*0.22)}">${badge}</text>`;
  s+=`</svg>`;return s;
}
const avBig=f=>`<div>${circleSvg(f.c,f.ch,48,f.badge)}</div><div class="av-name">${f.nick}</div>`;
const avSm=(f,sz=28)=>circleSvg(f.c,f.ch,sz);
const avPick=(f,sz=34)=>circleSvg(f.c,f.ch,sz);

/* ══ ZONES (Zones of Regulation) ══ */
const ZONES=[
  {id:'green', cn:'绿', c:'#7BAE7F', name:'刚刚好', sub:'平静·开心\n专注·刚刚好'},
  {id:'blue',  cn:'蓝', c:'#6F9FBE', name:'慢吞吞', sub:'难过·累\n没力气·无聊'},
  {id:'yellow',cn:'黄', c:'#E0B23E', name:'毛毛躁', sub:'着急·紧张\n兴奋·烦躁'},
  {id:'red',   cn:'红', c:'#D9645A', name:'炸开了', sub:'暴怒·失控\n崩溃·太满了'},
];
const gZ=id=>ZONES.find(z=>z.id===id)||ZONES[0];

/* friendly monster face per zone */
function monsterSvg(zid,size){
  const z=gZ(zid),s=size,c=z.c,ex=s*0.30,ey=s*0.44,er=s*0.085;
  let mouth='',extra='';
  if(zid==='green')mouth=`<path d="M${s*0.36} ${s*0.64} Q${s*0.5} ${s*0.76} ${s*0.64} ${s*0.64}" stroke="#fff" stroke-width="${s*0.05}" fill="none" stroke-linecap="round"/>`;
  if(zid==='blue'){mouth=`<path d="M${s*0.38} ${s*0.70} Q${s*0.5} ${s*0.62} ${s*0.62} ${s*0.70}" stroke="#fff" stroke-width="${s*0.045}" fill="none" stroke-linecap="round"/>`;extra=`<path d="M${s*0.7} ${s*0.5} q${s*0.04} ${s*0.1} 0 ${s*0.14} q-${s*0.04}-${s*0.04} 0-${s*0.14}" fill="#fff" opacity="0.85"/>`;}
  if(zid==='yellow')mouth=`<path d="M${s*0.36} ${s*0.68} q${s*0.07}-${s*0.06} ${s*0.14} 0 q${s*0.07} ${s*0.06} ${s*0.14} 0" stroke="#fff" stroke-width="${s*0.045}" fill="none" stroke-linecap="round"/>`;
  if(zid==='red'){mouth=`<ellipse cx="${s*0.5}" cy="${s*0.70}" rx="${s*0.11}" ry="${s*0.09}" fill="#fff"/>`;extra=`<path d="M${s*0.24} ${s*0.34} L${s*0.40} ${s*0.40}" stroke="#fff" stroke-width="${s*0.05}" stroke-linecap="round"/><path d="M${s*0.76} ${s*0.34} L${s*0.60} ${s*0.40}" stroke="#fff" stroke-width="${s*0.05}" stroke-linecap="round"/>`;}
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="display:block;overflow:visible">

/* ══ ZODIAC (auto sun sign from birthday) ══ */
function zodiac(bd){if(!bd)return'';const p=bd.split('-');if(p.length<3)return'';const m=+p[1],d=+p[2];if(!m||!d)return'';
  const cut=[19,18,20,19,20,20,22,22,22,22,21,21];
  const le=['♑摩羯','♒水瓶','♓双鱼','♈白羊','♉金牛','♊双子','♋巨蟹','♌狮子','♍处女','♎天秤','♏天蝎','♐射手'];
  const gt=['♒水瓶','♓双鱼','♈白羊','♉金牛','♊双子','♋巨蟹','♌狮子','♍处女','♎天秤','♏天蝎','♐射手','♑摩羯'];
  return (d<=cut[m-1]?le[m-1]:gt[m-1])+'座';}

const today=()=>fmtD(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const shiftD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d);};
const WK=['日','一','二','三','四','五','六'];
const fmtCN=s=>{const d=parseD(s);return`${d.getMonth()+1}月${d.getDate()}日·${WK[d.getDay()]}`;};

const esc=s=>(s||'').replace(/</g,'&lt;');

/* ══ PHOTOS ══ */
function resizeImg(file,maxW=400){
  return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');const ratio=Math.min(maxW/img.width,maxW/img.height,1);
    c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.65));};img.src=e.target.result;};r.readAsDataURL(file);});}

async function pickPhotosFor(target,max=5){
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;
  input.onchange=async e=>{const files=[...e.target.files].slice(0,max-target.length);
    for(const f of files){target.push(await resizeImg(f));}
    if(modal)rModal();else render();};input.click();}

/* ══ REPORTS ══ */
function weekDates(ref){const d=parseD(ref||today()),day=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
  const a=[];for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);a.push(fmtD(x));}return a;}
function monDates(y,m){const n=new Date(y,m,0).getDate(),a=[];for(let i=1;i<=n;i++)a.push(`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`);return a;}
function genReport(dates,title){
  let r=`# 咸粥楸芊·云平时 · ${title}\n${dates[0]} 至 ${dates[dates.length-1]}\n\n`;
  SECS.forEach(sec=>{const all=load(sec.key).filter(e=>dates.includes(e.date));if(!all.length)return;
    r+=`## ${sec.ico} ${sec.label}\n`;
    all.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      r+=`${fmtCN(e.date)} `;
      if(sec.id==='read'){const rd=(e.who||[]).map(id=>gFM(id).nick).join('、'),li=(e.listener||[]).map(id=>gFM(id).nick).join('、');
        r+=`${rd}读${e.book?'《'+e.book+'》':''} ${e.minutes||''}分钟`;if(li)r+=` → ${li}听`;if(e.rating)r+=` ${'★'.repeat(e.rating)}`;r+=`\n`;
        if(e.comment)r+=`  想说：${e.comment}\n`;
      }else if(sec.id==='share'){r+=`${gFM(e.who).nick}：${e.text}\n`;
      }else if(sec.id==='wish'){r+=`${gFM(e.who).nick}许愿：${e.text}${e.done?' ✅':' ✨'}\n`;
      }else if(sec.id==='emotion'){const z=gZ(e.zone);r+=`${gFM(e.who).nick} ${z.name}（${z.cn}区）`;if(e.time)r+=`·${e.time}`;if(e.place)r+=`·📍${e.place}`;r+=`\n`;if(e.text)r+=`  发生：${e.text}\n`;if(e.helped)r+=`  帮到我：${e.helped}\n`;
      }else{const who=(e.who||[]).map(id=>gFM(id).nick).join('、');r+=`${who}`;if(e.where)r+=` 📍${e.where}`;r+=`\n  ${e.text||''}`;if(e.note)r+=`\n  记录：${e.note}`;r+=`\n`;}});r+=`\n`;});
  let pr='';
  FM.forEach(f=>{const p=getP(f.id);const ent=load('xz_emotion').filter(e=>e.who===f.id&&dates.includes(e.date));
    const cnt={green:0,blue:0,yellow:0,red:0};ent.forEach(e=>{if(cnt[e.zone]!=null)cnt[e.zone]++;});
    const hasP=p.birthday||p.mayan||p.hd||p.love||p.fear||p.inspiration||(p.tools&&Object.values(p.tools).some(Boolean));
    if(!hasP&&!ent.length)return;
    pr+=`### ${f.nick}（${f.name}）\n`;
    if(p.birthday)pr+=`星座：${zodiac(p.birthday)}　生日：${p.birthday}\n`;
    if(p.mayan)pr+=`玛雅：${p.mayan}\n`;
    if(p.hd)pr+=`人类图：${p.hd}\n`;
    if(p.inspiration)pr+=`灵感：${p.inspiration}\n`;
    if(p.love)pr+=`爱：${p.love}\n`;
    if(p.fear)pr+=`怕：${p.fear}\n`;
    if(p.tools)ZONES.forEach(z=>{if(p.tools[z.id])pr+=`${z.cn}区工具：${p.tools[z.id]}\n`;});
    if(ent.length)pr+=`本期小怪兽：🟢${cnt.green} 🔵${cnt.blue} 🟡${cnt.yellow} 🔴${cnt.red}\n`;
    pr+=`\n`;});
  if(pr)r+=`## 🧭 家庭画像\n${pr}`;
  r+=`---\nLove · Hope · Respect\n`;return r;}

    <div class="pf-field" style="margin-top:12px"><label>玛雅星盘</label><textarea placeholder="例：红龙 · KIN 1…" oninput="setPF('${id}','mayan',this.value)">${esc(p.mayan)}</textarea></div>
    <div class="pf-field"><label>人类图 Human Design</label><textarea placeholder="例：生产者 · 情绪权威 · 6/2…" oninput="setPF('${id}','hd',this.value)">${esc(p.hd)}</textarea></div></div>`;
  h+=`<div class="pf-card"><h4>✨ 个人灵感</h4><div class="pf-field"><textarea placeholder="此刻关于这个人，我想记下的一句话…" oninput="setPF('${id}','inspiration',this.value)">${esc(p.inspiration)}</textarea></div></div>`;
  h+=`<div class="pf-card"><h4>💗 爱与怕<span class="hint">潜意识 · 慢慢看见</span></h4>
    <div class="pf-field"><label>我爱…</label><textarea placeholder="让 ${f.nick} 发光、放松、回到绿区的…" oninput="setPF('${id}','love',this.value)">${esc(p.love)}</textarea></div>
    <div class="pf-field"><label>我怕…</label><textarea placeholder="让 ${f.nick} 不安、退缩、变成红/黄怪兽的…" oninput="setPF('${id}','fear',this.value)">${esc(p.fear)}</textarea></div></div>`;
  h+=`<div class="pf-card"><h4>🧰 情绪工具箱<span class="hint">这样帮我回到绿区</span></h4>`;
  ZONES.forEach(z=>{const tv=(p.tools&&p.tools[z.id])||'';
    h+=`<div class="tool-row"><div class="tool-mon">${monsterSvg(z.id,30)}</div><textarea placeholder="在${z.cn}区·${z.name}时，这样帮我…" oninput="setTool('${id}','${z.id}',this.value)">${esc(tv)}</textarea></div>`;});
  h+=`</div>`;
  const ent=load('xz_emotion').filter(e=>e.who===id);
  const cnt={green:0,blue:0,yellow:0,red:0};ent.forEach(e=>{if(cnt[e.zone]!=null)cnt[e.zone]++;});
  const tot=ent.length;
  h+=`<div class="pf-card"><h4>👣 情绪足迹<span class="hint">${tot} 次记录</span></h4>`;
  if(tot){
    h+=`<div class="zbar">${ZONES.map(z=>cnt[z.id]?`<span style="flex:${cnt[z.id]};background:${z.c}"></span>`:'').join('')}</div>`;
    h+=`<div class="zlegend">${ZONES.map(z=>`<span><i style="background:${z.c}"></i>${z.name} ${cnt[z.id]}</span>`).join('')}</div>`;
    const ng=ent.filter(e=>e.zone!=='green');
    const top=(arr,key)=>{const m={};arr.forEach(e=>{const v=(e[key]||'').trim();if(v)m[v]=(m[v]||0)+1;});let bk='',bn=0;for(const k in m)if(m[k]>bn){bn=m[k];bk=k;}return bk?`${bk}（${bn}次）`:'';};
    const tp=top(ng,'time'),pl=top(ng,'place');
    if(tp||pl)h+=`<div class="pattern">大情绪（红/黄/蓝）最常出现在：${[tp&&'🕐 '+tp,pl&&'📍 '+pl].filter(Boolean).join('　·　')}</div>`;
  }else{h+=`<div class="pattern">还没有 ${f.nick} 的情绪记录。在「情绪小怪兽」里点一只，时间久了就能看见规律。</div>`;}
  h+=`</div>`;
  h+=`<button class="manual-btn" onclick="openManual('${id}')">📄 ${f.nick} 的使用说明书</button>`;
  h+=VALUES;el.innerHTML=h;}

/* ══ USER MANUAL ══ */
let manualText='';
function openManual(id){
  const f=gFM(id),p=getP(id);
  let txt=`《${f.nick}的使用说明书》\n`;
  if(p.birthday)txt+=`生日 ${p.birthday}　☀️${zodiac(p.birthday)}\n`;
  if(p.mayan)txt+=`玛雅 ${p.mayan}\n`;
  if(p.hd)txt+=`人类图 ${p.hd}\n`;
  if(p.inspiration)txt+=`\n灵感：${p.inspiration}\n`;
  if(p.love)txt+=`\n我爱：${p.love}\n`;
  if(p.fear)txt+=`我怕：${p.fear}\n`;
  const tools=ZONES.map(z=>{const t=(p.tools&&p.tools[z.id])||'';return t?`${z.cn}区·${z.name}：${t}`:'';}).filter(Boolean).join('\n');
  if(tools)txt+=`\n情绪工具箱：\n${tools}\n`;
  manualText=txt;
  document.querySelectorAll('.modal-bg').forEach(e=>e.remove());
  const div=document.createElement('div');div.className='modal-bg';
  div.onclick=e=>{if(e.target===div)div.remove();};
  let bh=`<div class="modal"><div class="modal-title">📄 ${f.nick}的使用说明书</div>`;
  bh+=`<div style="display:flex;justify-content:center;margin-bottom:14px">${circleSvg(f.c,f.ch,56,f.badge)}</div>`;
  bh+=`<pre class="rpt-pre">${esc(txt)}</pre>`;
  bh+=`<button class="rpt-copy" id="man-cp" onclick="copyManual(this)">复制 · 分享给老师/家人/Hi Ai</button>`;
  bh+=`<button class="btn btn-cancel" style="margin-top:10px;width:100%" onclick="this.closest('.modal-bg').remove()">关闭</button></div>`;
  div.innerHTML=bh;document.body.appendChild(div);}
function copyManual(btn){const done=()=>{btn.textContent='✓ 已复制';btn.classList.add('ok');setTimeout(()=>{btn.textContent='复制 · 分享给老师/家人/Hi Ai';btn.classList.remove('ok');},2000);};
  navigator.clipboard.writeText(manualText).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=manualText;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();});}

/* ══ EMOTION ADD ══ */
function openAddEmotion(zone){formData={date:(view==='emotion'&&filterDate)?filterDate:today(),who:[],zone:zone,time:'',place:'',text:'',helped:''};modal='emotion';rModal();}
function buildEmotionModal(div){
  let h=`<div class="modal"><div class="modal-title">记录小怪兽</div>`;
  h+=`<div class="field"><label>哪只小怪兽出来了？</label><div class="zone-grid">`;
  ZONES.forEach(zz=>{h+=`<div class="zone-pick ${formData.zone===zz.id?'sel':''}" onclick="formData.zone='${zz.id}';rModal()">${monsterSvg(zz.id,40)}<span style="color:${zz.c}">${zz.name}</span></div>`;});
  h+=`</div></div>`;
  h+=`<div class="field"><label>是谁？</label><div class="av-picker">`;
  FM.forEach(f=>{h+=`<div class="av-pick ${formData.who.includes(f.id)?'sel':''}" onclick="tP('who','${f.id}',1)">${avPick(f,36)}<span style="font-size:9px;color:var(--muted)">${f.nick}</span></div>`;});
  h+=`</div></div>`;
  h+=`<div class="field"><label>日期</label><input type="date" value="${formData.date}" onchange="formData.date=this.value" max="${today()}"></div>`;
  const times=['早上','上学前','在学校','放学','吃饭','洗澡','睡前','其他'];
  h+=`<div class="field"><label>什么时候？（可选）</label><div class="chips">${times.map(t=>`<span class="chip ${formData.time===t?'on':''}" onclick="formData.time=formData.time==='${t}'?'':'${t}';rModal()">${t}</span>`).join('')}</div></div>`;
  const places=['家里','学校','路上','外面','奶奶家','其他'];
  h+=`<div class="field"><label>在哪里？（可选）</label><div class="chips">${places.map(pl=>`<span class="chip ${formData.place===pl?'on':''}" onclick="formData.place=formData.place==='${pl}'?'':'${pl}';rModal()">${pl}</span>`).join('')}</div></div>`;
  h+=`<div class="field"><label>发生了什么？（可选）</label><textarea placeholder="刚刚……" oninput="formData.text=this.value">${esc(formData.text)}</textarea></div>`;
  let toolHint='';if(formData.who[0]){const tp=getP(formData.who[0]);toolHint=(tp.tools&&tp.tools[formData.zone])||'';}
  h+=`<div class="field"><label>什么帮到了我？（可选）${toolHint?`<span style="color:var(--light)"> · 工具箱：${esc(toolHint)}</span>`:''}</label><textarea placeholder="抱抱、深呼吸、喝水、安静一下……" oninput="formData.helped=this.value">${esc(formData.helped)}</textarea></div>`;
  h+=`<div class="btn-row"><button class="btn btn-cancel" onclick="modal=null;document.querySelector('.modal-bg').remove()">取消</button>
    <button class="btn btn-primary" onclick="saveE()">保存</button></div></div>`;
  div.innerHTML=h;}

/* ══ REPORT ══ */
function rReport(el){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;
  const dates=rptType==='week'?weekDates(today()):monDates(y,m);
  const title=rptType==='week'?'周报':`${fmtMon(y,m)}月报`;
  let h=`<div class="page-title">📊 日积月累</div><div class="page-desc">导出记录Hi Ai</div>`;
  h+=`<div class="rpt-nav"><button class="${rptType==='week'?'active':''}" onclick="rptType='week';render()">周报</button>
    <button class="${rptType==='month'?'active':''}" onclick="rptType='month';render()">月报</button></div>`;
  h+=`<pre class="rpt-pre">${esc(genReport(dates,title))}</pre>`;
  h+=`<button class="rpt-copy" id="cp-btn" onclick="copyRpt()">Hi Ai</button>`;
  h+=`<div class="data-sec"><div class="dt-title">数据管理</div><div class="data-btns">
    <button class="data-btn" onclick="exportAll()">导出数据</button>
    <button class="data-btn" onclick="$('#imp-f').click()">导入数据</button>
    <button class="data-btn del" onclick="clearAll()">清除</button></div></div>`;
  h+=VALUES;el.innerHTML=h;}
function copyRpt(){const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;
  const dates=rptType==='week'?weekDates(today()):monDates(y,m);
  const r=genReport(dates,rptType==='week'?'周报':`${fmtMon(y,m)}月报`);
  navigator.clipboard.writeText(r).then(()=>{const b=$('#cp-btn');b.textContent='✓ 已复制';b.classList.add('ok');
    setTimeout(()=>{b.textContent='Hi Ai';b.classList.remove('ok');},2000);}).catch(()=>{
    const ta=document.createElement('textarea');ta.value=r;ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    const b=$('#cp-btn');b.textContent='✓ 已复制';b.classList.add('ok');setTimeout(()=>{b.textContent='Hi Ai';b.classList.remove('ok');},2000);});}

/* ══ WISH PHOTOS ══ */
async function addWishPhoto(id){
  const data=load('xz_wish');const w=data.find(e=>e.id===id);if(!w)return;
  if(!w.photos)w.photos=[];
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;
  input.onchange=async e=>{const files=[...e.target.files].slice(0,5-w.photos.length);
    for(const f of files){w.photos.push(await resizeImg(f));}save('xz_wish',data);render();};input.click();}

/* ══ ADD MODAL ══ */
function openAdd(secId){formData={date:filterDate||today(),who:[],listener:[],text:'',book:'',where:'',note:'',comment:'',minutes:'',level:'',rating:0,photos:[]};modal=secId;rModal();}

function rModal(){
  document.querySelectorAll('.modal-bg').forEach(e=>e.remove());if(!modal)return;
  const sec=gSec(modal);const div=document.createElement('div');div.className='modal-bg';
  div.onclick=e=>{if(e.target===div){modal=null;div.remove();}};
  if(modal==='emotion'){buildEmotionModal(div);document.body.appendChild(div);return;}
  let h=`<div class="modal"><div class="modal-title">${sec.ico} 新记录</div>`;
  h+=`<div class="field"><label>日期</label><input type="date" value="${formData.date}" onchange="formData.date=this.value" max="${today()}"></div>`;

  if(modal==='share'||modal==='wish'){
    h+=`<div class="field"><label>谁</label><div class="av-picker">`;
    FM.forEach(f=>{h+=`<div class="av-pick ${formData.who.includes(f.id)?'sel':''}" onclick="tP('who','${f.id}',1)">${avPick(f,32)}<span style="font-size:9px;color:var(--muted)">${f.nick}</span></div>`;});
    h+=`</div></div>`;
  }else if(modal==='read'){
    h+=`<div class="field"><label>谁读</label><div class="av-picker">`;
    FM.forEach(f=>{h+=`<div class="av-pick ${formData.who.includes(f.id)?'sel':''}" onclick="tP('who','${f.id}')">${avPick(f,32)}<span style="font-size:9px;color:var(--muted)">${f.nick}</span></div>`;});
    h+=`</div></div><div class="field"><label>谁听</label><div class="av-picker">`;
    FM.forEach(f=>{h+=`<div class="av-pick ${formData.listener.includes(f.id)?'sel':''}" onclick="tP('listener','${f.id}')">${avPick(f,32)}<span style="font-size:9px;color:var(--muted)">${f.nick}</span></div>`;});
    h+=`</div></div>`;
  }else{
    h+=`<div class="field"><label>谁参与了</label><div class="av-picker">`;
    FM.forEach(f=>{h+=`<div class="av-pick ${formData.who.includes(f.id)?'sel':''}" onclick="tP('who','${f.id}')">${avPick(f,32)}<span style="font-size:9px;color:var(--muted)">${f.nick}</span></div>`;});
    h+=`</div></div>`;}

  if(modal==='read'){
    h+=`<div class="field"><label>书名</label><input type="text" placeholder="今天读了什么" value="${esc(formData.book)}" oninput="formData.book=this.value"></div>`;
    h+=`<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>分钟</label><input type="text" inputmode="numeric" placeholder="30" value="${formData.minutes}" oninput="formData.minutes=this.value"></div>
      <div class="field" style="flex:1"><label>级别</label><input type="text" placeholder="如 H" value="${esc(formData.level)}" oninput="formData.level=this.value"></div></div>`;
    h+=`<div class="field"><label>整体阅读感受</label><div class="stars">`;
    for(let i=1;i<=5;i++)h+=`<span class="star ${i<=formData.rating?'on':''}" onclick="formData.rating=${formData.rating===i?0:i};rModal()">★</span>`;
    h+=`</div></div>`;
    h+=`<div class="field"><label>关于今天的共读，我想说</label><textarea placeholder="我想说…" oninput="formData.comment=this.value" style="min-height:80px">${esc(formData.comment)}</textarea></div>`;
  }else if(modal==='share'){
    h+=`<div class="field"><label>分享内容</label><textarea placeholder="最近我想跟世界上的小朋友和大朋友分享的是…" style="min-height:90px" oninput="formData.text=this.value">${esc(formData.text)}</textarea></div>`;
  }else if(modal==='wish'){
    h+=`<div class="field"><label>愿望</label><textarea placeholder="我希望…" style="min-height:80px" oninput="formData.text=this.value">${esc(formData.text)}</textarea></div>`;
  }else if(modal==='move'){
    h+=`<div class="field"><label>去了哪里</label><input type="text" placeholder="公园、骑行路线…" value="${esc(formData.where)}" oninput="formData.where=this.value"></div>`;
    h+=`<div class="field"><label>做了什么</label><textarea placeholder="一起骑车到了…" oninput="formData.text=this.value">${esc(formData.text)}</textarea></div>`;
    h+=`<div class="field"><label>记录</label><textarea placeholder="有趣的细节…" oninput="formData.note=this.value">${esc(formData.note)}</textarea></div>`;
    h+=photoField();
  }else if(modal==='make'){
    h+=`<div class="field"><label>做了什么</label><textarea placeholder="一起烘焙、做饭…" oninput="formData.text=this.value">${esc(formData.text)}</textarea></div>`;
    h+=`<div class="field"><label>记录</label><textarea placeholder="过程中的小故事…" oninput="formData.note=this.value">${esc(formData.note)}</textarea></div>`;
    h+=photoField();}
  h+=`<div class="btn-row"><button class="btn btn-cancel" onclick="modal=null;document.querySelector('.modal-bg').remove()">取消</button>
    <button class="btn btn-primary" onclick="saveE()">保存</button></div></div>`;
  div.innerHTML=h;document.body.appendChild(div);}

function photoField(){
  let h=`<div class="field"><label>照片（最多5张）</label><div class="photos">`;
  (formData.photos||[]).forEach((p,i)=>{h+=`<img src="${p}" style="cursor:pointer" onclick="formData.photos.splice(${i},1);rModal()">`;});
  if((formData.photos||[]).length<5)h+=`<div class="photo-add" onclick="pickPhotosFor(formData.photos)">+</div>`;
  h+=`</div></div>`;return h;}

function tP(field,id,single){if(single)formData[field]=[id];else{const i=formData[field].indexOf(id);if(i>=0)formData[field].splice(i,1);else formData[field].push(id);}rModal();}

function saveE(){const sec=gSec(modal);if(!sec)return;const data=load(sec.key);const e={id:uid(),date:formData.date};
  if(modal==='read'){e.who=formData.who;e.listener=formData.listener;e.book=formData.book;e.minutes=formData.minutes;e.level=formData.level;e.rating=formData.rating;e.comment=formData.comment;}
  else if(modal==='share'){if(!formData.text.trim())return;e.who=formData.who[0]||'mama';e.text=formData.text;}
  else if(modal==='wish'){if(!formData.text.trim())return;e.who=formData.who[0]||'mama';e.text=formData.text;e.done=false;e.photos=[];}
  else if(modal==='emotion'){if(!formData.who[0]){alert('先选一下是谁哦～');return;}e.who=formData.who[0];e.zone=formData.zone;e.time=formData.time||'';e.place=formData.place||'';e.text=formData.text||'';e.helped=formData.helped||'';}
  else{e.who=formData.who;e.where=formData.where||'';e.text=formData.text;e.note=formData.note;e.photos=formData.photos||[];}
  data.push(e);save(sec.key,data);modal=null;document.querySelectorAll('.modal-bg').forEach(x=>x.remove());render();}

function delE(k,id){if(!confirm('删除这条记录？'))return;save(k,load(k).filter(e=>e.id!==id));render();}
function togWish(id){const d=load('xz_wish');const w=d.find(e=>e.id===id);if(w){w.done=!w.done;w.doneDate=w.done?today():null;if(!w.done)w.photos=[];}save('xz_wish',d);render();}

/* ══ DATA ══ */
function exportAll(){const d={version:4,exported:new Date().toISOString()};SECS.forEach(s=>{d[s.key]=load(s.key);});d.xz_profile=loadP();
  const b=new Blob([JSON.stringify(d)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`yunpingshi_${today()}.json`;a.click();URL.revokeObjectURL(a.href);}
function importAll(file){const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);
  SECS.forEach(s=>{if(d[s.key])save(s.key,d[s.key]);});if(d.xz_profile)saveP(d.xz_profile);render();alert('导入成功！');}catch(err){alert('导入失败');}};r.readAsText(file);}
function clearAll(){if(confirm('确定清除所有数据？建议先导出备份。')){SECS.forEach(s=>localStorage.removeItem(s.key));localStorage.removeItem('xz_profile');render();}}

render();
$('#imp-f').addEventListener('change',e=>{if(e.target.files[0])importAll(e.target.files[0]);e.target.value='';});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
